name = "byteforge"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# D1 Database binding
# To set up:
# 1. wrangler d1 create byteforge
# 2. Copy the database_id from the output
# 3. wrangler d1 execute byteforge --file=./schema/d1.sql

[[d1_databases]]
binding = "DB"
database_name = "byteforge"
database_id = "YOUR_D1_DATABASE_ID_HERE"
