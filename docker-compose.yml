# Docker Compose Configuration for ByteForge
# Provides complete local development and production environment

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: byteforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-byteforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byteforge_password}
      POSTGRES_DB: ${POSTGRES_DB:-byteforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - byteforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byteforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ByteForge Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: byteforge-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-byteforge}:${POSTGRES_PASSWORD:-byteforge_password}@db:5432/${POSTGRES_DB:-byteforge}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-byteforge}
      PGPASSWORD: ${POSTGRES_PASSWORD:-byteforge_password}
      PGDATABASE: ${POSTGRES_DB:-byteforge}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - byteforge-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: byteforge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@byteforge.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - byteforge-network
    depends_on:
      - db
    profiles:
      - tools

networks:
  byteforge-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
