<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ByteForge 通知中心：管理站点消息、账号提示与本地已读状态。">
  <meta name="theme-color" content="#050807">
  <title>通知中心 | ByteForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/pages.css">
  <link rel="stylesheet" href="/styles/ink-sci-fi.css">
</head>
<body data-page="notifications">
  <a class="skip-link" href="#main-content">跳至主内容</a>
  <canvas id="page-canvas" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand-link" href="/">ByteForge</a>
      <nav class="topnav" aria-label="页面导航">
        <a class="nav-link" href="/pages/profile.html">个人中心</a>
        <a class="nav-link" href="/pages/account.html">账号设置</a>
        <a class="nav-link" aria-current="page" href="/pages/notifications.html">通知</a>
        <a class="nav-link" href="/pages/nav.html">导航</a>
      </nav>
    </header>

    <main id="main-content">
      <section class="page-hero">
        <div>
          <p class="eyebrow">Inbox</p>
          <h1 class="page-title">通知中心</h1>
          <p class="page-summary">查看站点级通知、账号相关提示和反馈通道状态。</p>
        </div>
        <aside class="hero-status">
          <span class="status-row"><span>UNREAD</span><strong data-unread-count aria-live="polite">0</strong></span>
          <span class="status-row"><span>TOTAL</span><strong data-total-count>0</strong></span>
          <span class="status-row"><span>SESSION</span><strong class="status-value" data-auth-state>GUEST</strong></span>
        </aside>
      </section>

      <div class="layout-grid">
        <section class="panel">
          <h2 class="panel-title">消息</h2>
          <ul class="notice-list" data-notification-list></ul>
          <div class="actions">
            <button class="button" type="button" data-mark-all-read>全部已读</button>
            <button class="button secondary" type="button" data-clear-notices>重置状态</button>
          </div>
        </section>

        <aside class="panel">
          <h2 class="panel-title compact">订阅状态</h2>
          <p class="panel-note">当前版本使用浏览器本地状态记录已读标记。</p>
          <ul class="detail-list">
            <li><span>用户</span><strong data-user-name>未登录</strong></li>
            <li><span>角色</span><strong data-user-role>guest</strong></li>
            <li><span>会话</span><strong data-token-state>MISSING</strong></li>
          </ul>
        </aside>
      </div>
    </main>

    <footer class="page-footer">Notification state is local to this browser.</footer>
  </div>
  <script src="/scripts/pages.js"></script>
</body>
</html>
