<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteForge 管理系统</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base/variables.css">
  <link rel="stylesheet" href="/src/styles/pages/admin.css">
  <script>
    // 管理后台权限检查 - 必须在页面加载前执行
    (function() {
      const authToken = localStorage.getItem('auth_token');
      const user = localStorage.getItem('user');

      let isAuthorized = false;

      if (authToken && user) {
        try {
          const userData = JSON.parse(user);
          // 检查是否为管理员
          if (userData.role === 'admin') {
            isAuthorized = true;
          }
        } catch (error) {
          console.error('用户数据解析失败:', error);
        }
      }

      // 如果未授权，立即重定向到登录页
      if (!isAuthorized) {
        alert('⚠️ 访问受限\n\n此页面仅限管理员访问。\n请使用管理员账号登录。');
        window.location.href = '/pages/login.html?redirect=' + encodeURIComponent(window.location.pathname);
      }
    })();
  </script>
</head>
<body>
  <div class="admin-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>ByteForge</h1>
        <p>管理系统</p>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard">
          <span class="icon">📊</span>
          <span>仪表板</span>
        </button>
        <button class="nav-item" data-view="feedback">
          <span class="icon">💬</span>
          <span>反馈管理</span>
        </button>
        <button class="nav-item" data-view="content">
          <span class="icon">📄</span>
          <span>内容分析</span>
        </button>
        <button class="nav-item" data-view="events">
          <span class="icon">🔍</span>
          <span>事件日志</span>
        </button>
        <button class="nav-item" data-view="users">
          <span class="icon">👥</span>
          <span>用户管理</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="icon">⚙️</span>
          <span>系统设置</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="/" class="home-link">← 返回首页</a>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶部栏 -->
      <header class="topbar">
        <h2 class="page-title">仪表板</h2>
        <div class="topbar-actions">
          <button class="btn-refresh" id="refresh-btn">
            <span class="icon">🔄</span>
            <span>刷新</span>
          </button>
          <div class="auto-refresh">
            <input type="checkbox" id="auto-refresh" checked>
            <label for="auto-refresh">自动刷新 (60s)</label>
          </div>
        </div>
      </header>

      <!-- 仪表板视图 -->
      <div class="view-container" id="view-dashboard">
        <div class="stats-grid">
          <div class="stat-card stat-primary">
            <div class="stat-icon">💬</div>
            <div class="stat-content">
              <h3>总反馈</h3>
              <p class="stat-value" id="total-feedback">-</p>
              <span class="stat-trend" id="feedback-trend"></span>
            </div>
          </div>
          <div class="stat-card stat-success">
            <div class="stat-icon">👁️</div>
            <div class="stat-content">
              <h3>总浏览</h3>
              <p class="stat-value" id="total-views">-</p>
              <span class="stat-trend" id="views-trend"></span>
            </div>
          </div>
          <div class="stat-card stat-warning">
            <div class="stat-icon">🖱️</div>
            <div class="stat-content">
              <h3>总点击</h3>
              <p class="stat-value" id="total-clicks">-</p>
              <span class="stat-trend" id="clicks-trend"></span>
            </div>
          </div>
          <div class="stat-card stat-info">
            <div class="stat-icon">🔍</div>
            <div class="stat-content">
              <h3>总搜索</h3>
              <p class="stat-value" id="total-searches">-</p>
              <span class="stat-trend" id="searches-trend"></span>
            </div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header">
              <h3>最近反馈</h3>
              <button class="btn-small" onclick="switchView('feedback')">查看全部 →</button>
            </div>
            <div class="card-body">
              <div class="feedback-preview" id="recent-feedback">
                <div class="loading">加载中...</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>热门内容 Top 5</h3>
              <button class="btn-small" onclick="switchView('content')">查看全部 →</button>
            </div>
            <div class="card-body">
              <div class="top-list" id="top-content">
                <div class="loading">加载中...</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 反馈管理视图 -->
      <div class="view-container" id="view-feedback" style="display: none;">
        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="feedback-search" placeholder="搜索反馈内容...">
            <span class="icon">🔍</span>
          </div>
          <div class="filters">
            <select id="feedback-filter-doc">
              <option value="">所有文档</option>
            </select>
            <select id="feedback-sort">
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <table class="data-table" id="feedback-table">
              <thead>
                <tr>
                  <th>时间</th>
                  <th>路由</th>
                  <th>文档 ID</th>
                  <th>消息</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5" class="loading">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="pagination" id="feedback-pagination"></div>
      </div>

      <!-- 内容分析视图 -->
      <div class="view-container" id="view-content" style="display: none;">
        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="content-search" placeholder="搜索文档...">
            <span class="icon">🔍</span>
          </div>
          <div class="filters">
            <select id="content-sort">
              <option value="views">按浏览量</option>
              <option value="clicks">按点击量</option>
              <option value="feedback">按反馈数</option>
              <option value="recent">按活跃度</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <table class="data-table" id="content-table">
              <thead>
                <tr>
                  <th>文档 ID</th>
                  <th>浏览</th>
                  <th>点击</th>
                  <th>反馈</th>
                  <th>最后活动</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="6" class="loading">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 事件日志视图 -->
      <div class="view-container" id="view-events" style="display: none;">
        <div class="toolbar">
          <div class="filters">
            <select id="event-type-filter">
              <option value="">所有事件</option>
              <option value="view">浏览</option>
              <option value="click">点击</option>
              <option value="search">搜索</option>
              <option value="share">分享</option>
            </select>
            <select id="event-doc-filter">
              <option value="">所有文档</option>
            </select>
            <input type="date" id="event-date-filter">
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="events-list" id="events-list">
              <div class="loading">加载中...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 用户管理视图 -->
      <div class="view-container" id="view-users" style="display: none;">
        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="users-search" placeholder="搜索用户...">
            <span class="icon">🔍</span>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <table class="data-table" id="users-table">
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>邮箱</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>注册时间</th>
                  <th>最后登录</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="7" class="loading">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 系统设置视图 -->
      <div class="view-container" id="view-settings" style="display: none;">
        <div class="card">
          <div class="card-header">
            <h3>系统设置</h3>
          </div>
          <div class="card-body">
            <form id="settings-form" class="settings-form">
              <div class="setting-group">
                <label class="setting-label">
                  <input type="checkbox" id="setting-registration" name="registration_enabled">
                  <span>允许用户注册</span>
                </label>
                <p class="setting-desc">关闭后，新用户将无法注册账号</p>
              </div>

              <div class="setting-group">
                <label class="setting-label">
                  <input type="checkbox" id="setting-email-verify" name="require_email_verification">
                  <span>要求邮箱验证</span>
                </label>
                <p class="setting-desc">新用户注册后需要验证邮箱才能登录</p>
              </div>

              <div class="setting-group">
                <label for="setting-site-name">站点名称</label>
                <input type="text" id="setting-site-name" name="site_name" class="setting-input">
                <p class="setting-desc">显示在页面标题和导航栏</p>
              </div>

              <div class="form-error" id="settings-error"></div>

              <button type="submit" class="btn-primary" id="settings-save-btn">
                保存设置
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 模态框 -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">详情</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/src/pages/admin/admin.js"></script>
</body>
</html>
