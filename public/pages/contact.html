<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="联系 ByteForge 并提交站点、内容、账号或部署反馈。">
  <meta name="theme-color" content="#050807">
  <title>联系与反馈 | ByteForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/pages.css">
  <link rel="stylesheet" href="/styles/ink-sci-fi.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main-content">跳至主内容</a>
  <canvas id="page-canvas" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand-link" href="/">ByteForge</a>
      <nav class="topnav" aria-label="页面导航">
        <a class="nav-link" href="/pages/nav.html">导航</a>
        <a class="nav-link" href="/pages/help.html">帮助</a>
        <a class="nav-link" href="/pages/about.html">关于</a>
        <a class="nav-link" aria-current="page" href="/pages/contact.html">联系</a>
      </nav>
    </header>

    <main id="main-content">
      <section class="page-hero">
        <div>
          <p class="eyebrow">Contact</p>
          <h1 class="page-title">联系与反馈</h1>
          <p class="page-summary">提交站点问题、内容建议、账号访问和部署异常反馈。</p>
        </div>
        <aside class="hero-status">
          <span class="status-row"><span>ENDPOINT</span><strong>/api/feedback</strong></span>
          <span class="status-row"><span>SESSION</span><strong class="status-value" data-auth-state>GUEST</strong></span>
          <span class="status-row"><span>USER</span><strong data-user-name>未登录</strong></span>
        </aside>
      </section>

      <div class="layout-grid">
        <section class="panel">
          <h2 class="panel-title">反馈表单</h2>
          <form class="form-grid" data-contact-form>
            <div class="field">
              <label for="routePath">关联页面</label>
              <input id="routePath" name="routePath" type="text" value="/pages/contact.html">
            </div>
            <div class="field">
              <label for="feedbackMessage">反馈内容</label>
              <textarea id="feedbackMessage" name="message" required minlength="2" maxlength="1000" placeholder="写下问题、建议或需要跟进的上下文"></textarea>
            </div>
            <div class="actions">
              <button class="button" type="submit">提交反馈</button>
              <a class="action-link secondary" href="mailto:admin@thebyte.tech">邮件联系</a>
            </div>
            <p class="form-status" data-contact-status role="status" aria-live="polite"></p>
          </form>
        </section>

        <aside class="stack">
          <section class="panel">
            <h2 class="panel-title">当前身份</h2>
            <ul class="detail-list">
              <li><span>用户</span><strong data-user-name>未登录</strong></li>
              <li><span>邮箱</span><strong data-user-email>未绑定</strong></li>
              <li><span>角色</span><strong data-user-role>guest</strong></li>
            </ul>
          </section>

          <section class="panel">
            <h2 class="panel-title">相关入口</h2>
            <ul class="link-list">
              <li><a href="/pages/help.html"><strong>帮助中心</strong><span>Help</span></a></li>
              <li><a href="/pages/account.html"><strong>账号设置</strong><span>Account</span></a></li>
              <li><a href="/pages/admin.html"><strong>管理后台</strong><span>Admin</span></a></li>
            </ul>
          </section>
        </aside>
      </div>
    </main>

    <footer class="page-footer">Feedback is stored through the public feedback API.</footer>
  </div>
  <script src="/scripts/pages.js"></script>
</body>
</html>
