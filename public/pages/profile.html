<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ByteForge 个人中心：查看身份、角色、会话状态与常用入口。">
  <meta name="theme-color" content="#050807">
  <title>个人中心 | ByteForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/pages.css">
  <link rel="stylesheet" href="/styles/ink-sci-fi.css">
</head>
<body data-page="profile">
  <a class="skip-link" href="#main-content">跳至主内容</a>
  <canvas id="page-canvas" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand-link" href="/">ByteForge</a>
      <nav class="topnav" aria-label="页面导航">
        <a class="nav-link" href="/pages/nav.html">导航</a>
        <a class="nav-link" aria-current="page" href="/pages/profile.html">个人中心</a>
        <a class="nav-link" href="/pages/account.html">账号设置</a>
        <a class="nav-link" href="/pages/notifications.html">通知</a>
      </nav>
    </header>

    <main id="main-content">
      <section class="page-hero">
        <div>
          <p class="eyebrow">User Workspace</p>
          <h1 class="page-title">个人中心</h1>
          <p class="page-summary">集中查看当前身份、角色、会话状态和常用入口。</p>
        </div>
        <aside class="hero-status">
          <span class="status-row"><span>SESSION</span><strong class="status-value" data-auth-state>GUEST</strong></span>
          <span class="status-row"><span>ROLE</span><strong data-user-role>guest</strong></span>
          <span class="status-row"><span>USER</span><strong data-user-name>未登录</strong></span>
        </aside>
      </section>

      <section class="auth-gate" data-signed-in>
        <div class="layout-grid">
          <div class="stack">
            <section class="panel">
              <div class="profile-card">
                <div class="avatar" data-avatar>BF</div>
                <div>
                  <h2 class="profile-name" data-profile-title>访客</h2>
                  <p class="profile-meta" data-profile-subtitle>登录后显示账户资料与会话状态</p>
                </div>
              </div>
            </section>

            <section class="tile-grid" aria-label="账号概览">
              <div class="tile">
                <span class="tile-label">Role</span>
                <strong class="tile-value" data-profile-role>guest</strong>
              </div>
              <div class="tile">
                <span class="tile-label">Session</span>
                <strong class="tile-value" data-profile-session>inactive</strong>
              </div>
              <div class="tile">
                <span class="tile-label">Token</span>
                <strong class="tile-value" data-token-state>MISSING</strong>
              </div>
            </section>
          </div>

          <aside class="panel">
            <h2 class="panel-title">账户资料</h2>
            <ul class="detail-list">
              <li><span>ID</span><strong data-profile-id>N/A</strong></li>
              <li><span>邮箱</span><strong data-profile-email>N/A</strong></li>
              <li><span>刷新令牌</span><strong data-refresh-state>MISSING</strong></li>
            </ul>
            <div class="actions">
              <button class="button" type="button" data-refresh-session>刷新会话</button>
              <a class="action-link secondary" href="/pages/account.html">账号设置</a>
              <button class="button danger" type="button" data-logout>退出登录</button>
            </div>
            <p class="form-status" data-session-status role="status" aria-live="polite"></p>
          </aside>
        </div>
      </section>

      <section class="auth-gate" data-signed-out>
        <div class="panel">
          <h2 class="panel-title">未登录</h2>
          <p class="panel-note">登录后可查看个人资料、账号状态和管理入口。</p>
          <div class="actions">
            <a class="action-link" href="/pages/login.html?redirect=%2Fpages%2Fprofile.html">登录或注册</a>
            <a class="action-link secondary" href="/pages/nav.html">返回导航</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="page-footer">ByteForge account surface</footer>
  </div>
  <script src="/scripts/pages.js"></script>
</body>
</html>
