<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteForge 管理后台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
  <script>
    // 管理后台权限检查 - 必须在页面加载前执行
    (function() {
      const authToken = localStorage.getItem('auth_token');
      const user = localStorage.getItem('user');

      let isAuthorized = false;

      if (authToken && user) {
        try {
          const userData = JSON.parse(user);
          // 检查是否为管理员
          if (userData.role === 'admin') {
            isAuthorized = true;
          }
        } catch (error) {
          console.error('用户数据解析失败:', error);
        }
      }

      // 如果未授权，立即重定向到登录页
      if (!isAuthorized) {
        alert('⚠️ 访问受限\n\n此页面仅限管理员访问。\n请使用管理员账号登录。');
        window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
      }
    })();
  </script>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>ByteForge 管理后台</h1>
      <nav>
        <a href="/" class="nav-link">← 返回首页</a>
        <button id="refresh-btn" class="refresh-btn">🔄 刷新数据</button>
      </nav>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">💬</div>
        <div class="stat-content">
          <h3>总反馈</h3>
          <p id="total-feedback" class="stat-value">-</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👁️</div>
        <div class="stat-content">
          <h3>总浏览</h3>
          <p id="total-views" class="stat-value">-</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🖱️</div>
        <div class="stat-content">
          <h3>总点击</h3>
          <p id="total-clicks" class="stat-value">-</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔍</div>
        <div class="stat-content">
          <h3>总搜索</h3>
          <p id="total-searches" class="stat-value">-</p>
        </div>
      </div>
    </section>

    <section class="content-section">
      <h2>📝 最近反馈</h2>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>路由</th>
              <th>文档 ID</th>
              <th>消息</th>
            </tr>
          </thead>
          <tbody id="feedback-tbody">
            <tr>
              <td colspan="4" class="loading">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="content-section">
      <h2>🔥 热门文档（按浏览量）</h2>
      <ol id="top-docs-list" class="top-docs-list">
        <li class="loading">加载中...</li>
      </ol>
    </section>

    <footer class="admin-footer">
      <p>ByteForge Admin Dashboard | 数据每分钟自动刷新</p>
    </footer>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
