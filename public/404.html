<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 - Page not found</title>
  <style>
    :root { color-scheme: dark; font-family: "Fira Code", ui-monospace, monospace; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0a0a0a; color: #e8e6e1; }
    main { max-width: 38rem; padding: 2rem; text-align: center; }
    h1 { color: #00f3ff; font-size: clamp(3rem, 12vw, 7rem); margin: 0; }
    p { line-height: 1.6; }
    a { color: #00f3ff; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>请求的页面不存在，可能已移动或被删除。</p>
    <a href="/">返回 ByteForge 首页</a>
  </main>
</body>
</html>
