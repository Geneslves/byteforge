name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Activate pnpm 10.33.0 through Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(pnpm --version)" = "10.33.0"

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-node22-

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and build Pagefind
        run: pnpm run check

      - name: Validate infrastructure shell scripts
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            if head -n1 "$script" | grep -q 'bash'; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done < <(find infra -type f -name '*.sh' -print0)

      - name: Validate production Compose
        shell: bash
        env:
          DEPLOY_ENV: staging
          BYTEFORGE_IMAGE: ghcr.io/geneslves/byteforge:ci
          BYTEFORGE_ENV_FILE: ${{ github.workspace }}/infra/env/staging.env.example
        run: |
          docker compose \
            --env-file infra/env/staging.env.example \
            --file infra/docker-compose.prod.yml \
            config --quiet

      - name: Build production image
        shell: bash
        run: |
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg REPOSITORY_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag byteforge:ci \
            .
